name: YouTube Monitor

# 频道监控：检查 11 个监控频道的新视频，发现就发 QQ 邮件。
# 由 cron-job.org 每 5 分钟通过 API 触发 workflow_dispatch。
# 不用 GitHub 原生 schedule（延迟 5~30 分钟且会丢）。
on:
  workflow_dispatch:
    inputs:
      init:
        description: '初始化模式：只记录已存在的视频，不发邮件'
        type: boolean
        default: false

# 上一轮没跑完就取消旧的，避免堆积
concurrency:
  group: youtube-monitor-group
  cancel-in-progress: true

permissions:
  contents: write        # 需要把 history.json 提交回仓库

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 状态用 git 提交持久化，不用 actions/cache
      # （cache 命中主键时不会写新缓存，曾导致状态永远不更新）
      - name: 恢复状态
        run: |
          git config user.name  "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          for f in history.json radar_state.json; do
            if git show HEAD:"$f" > "$f" 2>/dev/null; then
              echo "  ✓ 从仓库恢复 $f ($(wc -c < "$f") bytes)"
            else
              echo "  - 仓库里没有 $f（首次运行会自动生成）"
            fi
          done

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 检查频道更新
        env:
          # 敏感信息由 GitHub Secrets 注入，脚本内 os.getenv() 优先读取
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
          NOTIFICATION_RECIPIENT: ${{ secrets.NOTIFICATION_RECIPIENT }}
          # CI 直连 YouTube API（不走本地 Clash 代理）
          CLASH_PROXY_HOST: ''
          CLASH_PROXY_PORT: ''
        run: |
          if [ "${{ inputs.init }}" = "true" ]; then
            echo "=== 初始化模式：只记录，不发邮件 ==="
            python yt_monitor.py --init
          else
            python yt_monitor.py
          fi

      # always() 保证即使检查失败也保存状态
      - name: 保存状态
        if: always()
        run: |
          [ -f history.json ] && git add -f history.json 2>/dev/null || true
          [ -f radar_state.json ] && git add -f radar_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "状态无变化，跳过提交"
          else
            git commit -q -m "chore(history): 更新已通知记录 $(date -u +'%Y-%m-%dT%H:%M:%SZ') [skip ci]"
            git pull --rebase --autostash -q origin main || true
            git push -q origin HEAD:main && echo "✓ 状态已提交" || echo "✗ 提交失败"
          fi