name: YouTube Monitor

# 由 cron-job.org 每 5 分钟通过 API 触发 workflow_dispatch。
# 不用 GitHub 原生 schedule：它延迟 5~30 分钟且会丢，做不到「发布后 1 小时内密集采样」。
on:
  workflow_dispatch:

# 上一轮没跑完就取消旧的，让最新的立刻跑，避免堆积
concurrency:
  group: youtube-monitor-group
  cancel-in-progress: true

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 固定 cache key：每次运行都命中同一个缓存并原地更新。
      # 原来用 ${{ github.run_id }} 会每 5 分钟创建一个新缓存，
      # 一天 288 个，很快撞上仓库 10GB 缓存上限。
      - name: 恢复状态
        uses: actions/cache@v4
        with:
          path: |
            history.json
            radar_state.json
            harvest_state.json
          key: yt-monitor-state-v4
          restore-keys: |
            yt-monitor-state-v4
            yt-monitor-history-

      - name: 运行（全天打捞 + 频道监控）
        env:
          # ---- API 钥匙：每把独立项目 = 各自 10,000 点/天 ----
          # 想要更多额度就继续加 YOUTUBE_API_KEY_6、_7 …（脚本最多认到 _10）
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_API_KEY_2: ${{ secrets.YOUTUBE_API_KEY_2 }}
          YOUTUBE_API_KEY_3: ${{ secrets.YOUTUBE_API_KEY_3 }}
          YOUTUBE_API_KEY_4: ${{ secrets.YOUTUBE_API_KEY_4 }}
          YOUTUBE_API_KEY_5: ${{ secrets.YOUTUBE_API_KEY_5 }}

          # ---- 邮件 ----
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
          NOTIFICATION_RECIPIENT: ${{ secrets.NOTIFICATION_RECIPIENT }}

          # ---- CI 直连（不走本地 Clash 代理）----
          CLASH_PROXY_HOST: ''
          CLASH_PROXY_PORT: ''

          # ---- 运行模式 ----
          # harvest = 只跑全天打捞（推荐：配额全给采集层）
          # all     = 打捞 + 频道监控（频道监控另分走一部分配额）
          HARVEST_MODE: 'harvest'
        run: |
          set -e
          if [ "$HARVEST_MODE" = "all" ]; then
            python yt_monitor.py --radar-only || true
          fi
          python harvest_daemon.py --once
